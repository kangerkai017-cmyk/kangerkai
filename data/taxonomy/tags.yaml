# 这是规范库与检索层共享的唯一标签依据。新增标准或新领域时，只需在此扩充：
#   - scenario_rules / hazard_rules：关键词 -> 标签（关键词命中文本即打标签）
#   - high_altitude_keywords：触发"高处作业"默认场景标签的关键词
#   - high_altitude_scenario_tags：判定"高处坠落"危险的场景标签集合
#   - collapse_scenario_tags：判定"坍塌"危险的场景标签集合
#   - standard_tag_hints：按标准号前缀直接补充标签（解决正文无关键词、PDF 抽取差的标准）
#   - scenario_fallback / hazard_fallback：兜底标签（保证每个 chunk 标签非空）
# 修改后需重跑 build_norm_chunks.py + build_norm_index.py。

